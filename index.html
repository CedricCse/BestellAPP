<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BestellAPP</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styles/assets.css">
    <link rel="stylesheet" href="styles/standard.css">
    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="styles/basket.css">

    <script src="script.js" defer></script>
    <script src="scripts/template.js" defer></script>
    <script src="scripts/db.js" defer></script>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <img class="app" src="./assets/icons/Logo 02.svg" alt="BestellAPP">
            <img class="menu" src="./assets/icons/menu.svg" alt="Menü">
        </div>
    </header>

    <section class="main-section">
        <main>
            <div class="hero">
                <img src="./assets/img/hero.png" alt="Burger und Pizza">
                <img class="burger-logo" src="./assets/icons/Burger-Logo.svg" alt="Burger-Logo">
            </div>

            <div class="burgerhouse">
            <div class="burgerhouse-title">
                <h1><span>Burger</span>House</h1>

            <div class="rating">
                <img src="./assets/icons/Frame 28.svg" alt="Bewertung">
        </div>
    </div>

    <p>The best of Burgers, Pizza, and Greens, all in one great place.</p>

</div>
        </main>
    </section>
</body>
</html>
